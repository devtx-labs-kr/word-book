# --- Server (local-only binding per security-design SD-1) ---
server.address=127.0.0.1
server.port=8080

# --- Persistence: H2 file mode so data survives restarts (RD-1) ---
spring.datasource.url=jdbc:h2:file:./data/wordbook
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Actuator: expose health only (monitoring-design) ---
management.endpoints.web.exposure.include=health
